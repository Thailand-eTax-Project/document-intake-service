server:
  port: 8081
  # Maximum size of HTTP request (includes headers, body, etc.)
  max-http-request-header-size: 65536
  tomcat:
    # Maximum size of POST request body
    max-swallow-size: -1  # Unlimited (we validate at application layer)
    max-http-form-post-size: -1  # Unlimited

spring:
  application:
    name: document-intake-service
  threads:
    virtual:
      enabled: true

  # Servlet multipart configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intake_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

# Apache Camel
camel:
  springboot:
    name: document-intake-camel
    main-run-controller: true
  component:
    kafka:
      brokers: ${KAFKA_BROKERS:localhost:9092}
  dataformat:
    jackson:
      auto-discover-object-mapper: true
      
# Application-specific configuration
app:
  # Security configuration
  security:
    enabled: ${SECURITY_ENABLED:true}
    jwt:
      # OAuth2 JWT issuer URI (configure for your identity provider)
      issuer-uri: ${JWT_ISSUER_URI:}
      # JWKS endpoint (if not using standard issuer-uri)
      jwks-uri: ${JWT_JWKS_URI:}
    # Rate limiting using Apache Camel throttler
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      # Maximum requests per second per client IP
      requests-per-second: ${RATE_LIMIT_REQUESTS_PER_SECOND:10}
      # Time period in seconds for the rate limit
      time-period-seconds: ${RATE_LIMIT_TIME_PERIOD_SECONDS:60}

  # Validation limits
  validation:
    # Maximum XML document size in bytes (default: 10MB)
    max-xml-size: ${MAX_XML_SIZE:10485760}
    # Maximum element nesting depth (prevents deep element attacks)
    max-xml-depth: ${MAX_XML_DEPTH:100}
    # Maximum number of elements (prevents excessive element count attacks)
    max-element-count: ${MAX_ELEMENT_COUNT:10000}

  xml:
    schemas:
      # XSD schema paths for Thai e-Tax document validation
      tax-invoice: e-tax-invoice-receipt-v2.1/ETDA/data/standard/TaxInvoice_CrossIndustryInvoice_2p1.xsd
      receipt: e-tax-invoice-receipt-v2.1/ETDA/data/standard/Receipt_CrossIndustryInvoice_2p1.xsd
      invoice: e-tax-invoice-receipt-v2.1/ETDA/data/standard/Invoice_CrossIndustryInvoice_2p1.xsd
      debit-credit-note: e-tax-invoice-receipt-v2.1/ETDA/data/standard/DebitCreditNote_CrossIndustryInvoice_2p1.xsd
      cancellation-note: e-tax-invoice-receipt-v2.1/ETDA/data/standard/CancellationNote_CrossIndustryInvoice_2p1.xsd
      abbreviated-tax-invoice: e-tax-invoice-receipt-v2.1/ETDA/data/standard/AbbreviatedTaxInvoice_CrossIndustryInvoice_2p1.xsd

  # Outbox configuration
  outbox:
    pending-threshold: ${OUTBOX_PENDING_THRESHOLD:100}

  kafka:
    topics:
      # Consumer topics
      invoice-intake: document.intake
      # Dead letter queue
      intake-dlq: document.intake.dlq

      # Saga orchestrator topics (outbox pattern with Debezium CDC)
      # Commands to orchestrator-service
      saga-commands-orchestrator: saga.commands.orchestrator
      # Trace events for notification-service
      trace-document-received: trace.document.received

    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}

# Eureka client configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Resilience4j rate limiting
resilience4j:
  ratelimiter:
    instances:
      documentIntake:
        limit-for-period: ${app.rate-limit.requests-per-second:10}
        limit-refresh-period: "${app.rate-limit.time-period-seconds:60}s"
        timeout-duration: 0s

# Logging configuration
logging:
  level:
    root: INFO
    com.wpanther.document.intake: DEBUG
    org.apache.camel: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
